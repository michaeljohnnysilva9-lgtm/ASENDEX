name: Build ASENDEX Wallet Mobile APK

on:
  push:
    branches: [asentum-mobile-wallet]
    paths:
      - 'mobile-wallet/**'
      - '.github/workflows/asentum-mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply ASENDEX Wallet 0.4 integration patch
        run: python3 mobile-wallet/scripts/patch_v040.py
      - name: Keep wallet session when switching Android apps
        run: python3 mobile-wallet/scripts/patch_v041.py
      - name: Enable native Asentum extension Connect compatibility
        run: python3 mobile-wallet/scripts/patch_v042.py
      - name: Stamp mobile browser version
        run: sed -i 's#0.3.1#0.4.2#g; s#0.3.2#0.4.2#g; s#0.3.3#0.4.2#g; s#0.4.0#0.4.2#g; s#0.4.1#0.4.2#g' mobile-wallet/app/src/main/java/com/asentum/wallet/MainActivity.java
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build ASENDEX Wallet web assets
        working-directory: mobile-wallet/web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: mobile-wallet
        run: gradle --no-daemon :app:assembleDebug
      - name: Stage APK
        run: |
          mkdir -p artifact
          cp mobile-wallet/app/build/outputs/apk/debug/app-debug.apk artifact/ASENDEX-Wallet-Mobile-0.4.2-beta.apk
          sha256sum artifact/ASENDEX-Wallet-Mobile-0.4.2-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: asendex-wallet-mobile-android
          path: artifact/ASENDEX-Wallet-Mobile-0.4.2-beta.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish permanent beta APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='asendex-wallet-mobile-v0.4.2-beta'
          APK='artifact/ASENDEX-Wallet-Mobile-0.4.2-beta.apk'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease \
              --title 'ASENDEX Wallet Mobile 0.4.2 Beta · Native Asentum Connect' \
              --notes 'Improves Asentum dApp compatibility. The ASENDEX provider is injected at document start using the official window.asentum API. For dApps still shipping @asentum/connect with extensionStatus=soon, the wallet detects the official disabled Browser extension option inside its own WebView, enables ASENDEX Wallet Mobile as the available Asentum extension, routes Connect through the real native approval flow, persists the standard asentum:connect:address extension session and reloads the dApp into its connected state. DApps already using extensionStatus=ready keep their original native Connect flow unchanged. Includes persistent app session, ase1 addresses, biometrics, native swap, token search, wallet handoff and Liquidity/Pools.'
          fi
