name: Build Asentum Mobile Wallet APK

on:
  push:
    branches: [asentum-mobile-wallet]
    paths:
      - 'mobile-wallet/**'
      - '.github/workflows/asentum-mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build secure wallet web assets
        working-directory: mobile-wallet/web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: mobile-wallet
        run: gradle --no-daemon :app:assembleDebug
      - name: Stage APK
        run: |
          mkdir -p artifact
          cp mobile-wallet/app/build/outputs/apk/debug/app-debug.apk artifact/Asentum-Wallet-0.1.0-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: asentum-wallet-android
          path: artifact/Asentum-Wallet-0.1.0-beta.apk
          if-no-files-found: error
          retention-days: 30
