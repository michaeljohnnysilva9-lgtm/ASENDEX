name: Update ASENDEX Wallet Download v0.4.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-wallet-download-v044.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Wallet APK links to 0.4.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['public/index.html','index.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text()
              import re
              s=re.sub(r'asendex-wallet-mobile-v0\.4\.[0-9]+-beta/ASENDEX-Wallet-Mobile-0\.4\.[0-9]+-beta\.apk',
                       'asendex-wallet-mobile-v0.4.4-beta/ASENDEX-Wallet-Mobile-0.4.4-beta.apk',s)
              s=re.sub(r'Download Android APK · v0\.4\.[0-9]+','Download Android APK · v0.4.4',s)
              p.write_text(s)
          PY
      - name: Commit updated web download
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html 2>/dev/null || true
          test -f index.html && git add index.html || true
          if git diff --cached --quiet; then
            echo 'No download links required an update.'
          else
            git commit -m 'web: update ASENDEX Wallet download to 0.4.4'
            git push origin main
          fi
