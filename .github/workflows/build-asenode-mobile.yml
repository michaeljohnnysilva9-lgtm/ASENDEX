name: Build Asentum Operator Mobile APK

on:
  push:
    branches: [ asenode-mobile-android ]
    paths:
      - 'asenode-mobile/**'
      - '.github/workflows/build-asenode-mobile.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: asenode-mobile/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp asenode-mobile/android/app/build/outputs/apk/debug/app-debug.apk ASENTUM-Operator-Mobile-v0.2-beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ASENTUM-Operator-Mobile-v0.2-beta
          path: ASENTUM-Operator-Mobile-v0.2-beta.apk
          if-no-files-found: error
