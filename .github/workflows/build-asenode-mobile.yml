name: Build ASENODE Mobile Android

on:
  push:
    branches:
      - asenode-mobile-v0.1
    paths:
      - 'asenode-mobile/**'
      - '.github/workflows/build-asenode-mobile.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p asenode-mobile :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          cp asenode-mobile/app/build/outputs/apk/debug/app-debug.apk ASENODE-Mobile-0.1.0-beta.apk
          sha256sum ASENODE-Mobile-0.1.0-beta.apk | tee ASENODE-Mobile-0.1.0-beta.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASENODE-Mobile-0.1.0-beta
          path: |
            ASENODE-Mobile-0.1.0-beta.apk
            ASENODE-Mobile-0.1.0-beta.sha256
          retention-days: 30
