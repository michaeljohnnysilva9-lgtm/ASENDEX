name: Update ASENDEX Wallet Download v0.4.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-wallet-download-v041.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point all Wallet APK links to 0.4.1
        run: |
          sed -i 's#asendex-wallet-mobile-v0\.4\.0-beta/ASENDEX-Wallet-Mobile-0\.4\.0-beta\.apk#asendex-wallet-mobile-v0.4.1-beta/ASENDEX-Wallet-Mobile-0.4.1-beta.apk#g; s#Download Android APK · v0\.4\.0#Download Android APK · v0.4.1#g; s#Download Android APK · v0\.4#Download Android APK · v0.4.1#g' public/index.html index.html 2>/dev/null || true
      - name: Commit updated web download
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html index.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No download links required an update.'
          else
            git commit -m 'web: update ASENDEX Wallet download to 0.4.1'
            git push origin main
          fi
