plugins {
    id 'com.android.application'
}

android {
    namespace 'com.asentum.wallet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.asentum.wallet'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-beta'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// androidx.biometric 1.1.x still references the old split Kotlin JDK artifacts.
// Modern Kotlin stdlib already contains those classes, so exclude the legacy splits.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.biometric:biometric:1.1.0'
}
